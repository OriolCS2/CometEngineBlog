# Change baseurl before deploy
baseurl = "https://OriolCS2.github.io/CometEngineBlog/"
languageCode = "en-us"
title = "Comet Engine Blog"

# Posts link to posts that are scheduled for later weeks. Those pages do not
# exist yet at build time, so a missing ref must not fail the build. The link
# points to "#" until the target is published and the next deploy runs.
refLinksErrorLevel = "warning"

# Theme i18n support
# Available values: en, fr, id, ja, ko, pt-br, zh-cn, zh-tw, es, de, nl, it, th, el, uk, ar
defaultContentLanguage = "en"

# Set hasCJKLanguage to true if DefaultContentLanguage is in [zh-cn ja ko]
# This will make .Summary and .WordCount behave correctly for CJK languages.
hasCJKLanguage = false

# Change it to your Disqus shortname before using
disqusShortname = "hugo-theme-stack"

[pagination]
pagerSize = 5